services:
  db:
    image: postgres:16-alpine
    container_name: shiii_postgres
    restart: always
    environment:
      POSTGRES_USER: shiii_user
      POSTGRES_PASSWORD: shiii_password
      POSTGRES_DB: shiii_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
